<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>G.L. Bajaj Online Book Store</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Header -->
    <header>
        <div class="logo">
            <img src="logo.jpg" alt="G.L. Bajaj Logo">
        </div>

        <h1>G.L. Bajaj Online Book Store</h1>

        <nav>
            <a href="index.html">Home</a>
            <span>|</span>

            <a href="login.html">Login</a>
            <span>|</span>

            <a href="register.html">Register</a>
            <span>|</span>

            <a href="catalogue.html">Catalogue</a>
            <span>|</span>

            <a href="cart.html">Cart</a>
        </nav>
    </header>

    <!-- Main Content -->
    <div class="main">

        <!-- Sidebar -->
        <aside class="sidebar">
            <h2>Categories</h2>

            <div class="category">CSE Books</div>
            <div class="category">ECE Books</div>
            <div class="category">Mechanical Books</div>
        </aside>

        <!-- Login Section -->
        <section class="content" id="login">

            <div class="login-box">

                <h2>Login Page</h2>

                <form id="loginForm">

                    <div class="input-group">
                        <input
                            type="text"
                            id="username"
                            placeholder="Username"
                            autocomplete="username"
                            required
                        >
                    </div>

                    <div class="input-group">
                        <input
                            type="password"
                            id="password"
                            class="password-input"
                            placeholder="Password"
                            autocomplete="current-password"
                            required
                        >

                        <span
                            class="show-password"
                            id="eye"
                            onclick="togglePassword()"
                            title="Show/Hide Password"
                        >👁️</span>
                    </div>

                    <button type="submit" class="login-btn">
                        Login
                    </button>

                    <div id="message"></div>

                </form>

                <div class="extra">
                    Don't have an account?
                    <a href="register.html">Register</a>
                </div>

            </div>

        </section>

    </div>

    <!-- Footer -->
    <footer>
        © Created by Rupal Gupta<br>
        Roll No. 2501920110319
    </footer>

    <!-- JavaScript -->
    <script>
        // Show / Hide Password
        function togglePassword() {
            const password = document.getElementById("password");
            const eye = document.getElementById("eye");

            if (password.type === "password") {
                password.type = "text";
                eye.textContent = "🙈";
            } else {
                password.type = "password";
                eye.textContent = "👁️";
            }
        }

        // Login Validation
        document.getElementById("loginForm").addEventListener("submit", function (event) {
            event.preventDefault();

            const username = document.getElementById("username").value.trim();
            const password = document.getElementById("password").value;
            const message = document.getElementById("message");

            // Demo login credentials
            const correctUsername = "Rupal Gupta";
            const correctPassword = "1234";

            const enteredUsername = username.toLowerCase();

            if (username === "" || password === "") {
                message.style.color = "red";
                message.textContent = "Please enter username and password.";
                return;
            }

            if (enteredUsername === correctUsername.toLowerCase() && password === correctPassword) {
                message.style.color = "green";
                message.textContent = "Login successful!";
            } else {
                message.style.color = "red";
                message.textContent = "Invalid username or password!";
            }
        });
    </script>

</body>
</html>
